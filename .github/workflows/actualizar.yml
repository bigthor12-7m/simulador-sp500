name: Actualizar datos

# Cada lunes a primera hora (05:37 UTC = 07:37 en Madrid en verano, 06:37 en invierno) con las cotizaciones del cierre del viernes.
# También se puede lanzar a mano: pestaña Actions > Actualizar datos > Run workflow.
on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt
      - name: Descargar la lista del S&P 500 y los datos de Yahoo Finance y de la SEC
        run: python pipeline/descargar.py --salida /tmp/brutos
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Aplicar las reglas del modelo
        run: python pipeline/procesar.py --brutos /tmp/brutos --salida app/datos
      - name: Valorar con el motor de la app, añadir la semana al histórico y al seguimiento de las estrategias
        env:
          AVISOS_MD: ${{ runner.temp }}/avisos_semana.md
          PROPIETARIO: ${{ github.repository_owner }}
        run: node pipeline/calcular.js app/datos
      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "actualizador-semanal"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/datos
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -q -m "Datos de la semana del $(date -u +%F)" && git push; fi
      - name: Avisos por correo (issue de GitHub asignada al propietario)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${{ runner.temp }}/avisos_semana.md"
          if [ -s "$f" ]; then
            gh issue create --title "Avisos de la semana del $(date -u +%d/%m/%Y)" --body-file "$f" --assignee "${{ github.repository_owner }}" \
              || gh issue create --title "Avisos de la semana del $(date -u +%d/%m/%Y)" --body-file "$f" || echo "No se pudo crear el aviso"
          else
            echo "Sin avisos esta semana"
          fi
      - name: Guardar los datos brutos en la rama brutos (para revisar)
        run: |
          cd /tmp/brutos
          git init -q -b brutos
          git config user.name "actualizador-semanal"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Datos brutos $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" brutos
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: despliegue
        uses: actions/deploy-pages@v4
